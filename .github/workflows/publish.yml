name: Publish forwarding pages

# The site moved to https://www.theperformanceconsultant.net (2 November 2026).
# This publishes the static forwarding pages in site/ as they are: no build,
# no schedule. They are generated by scripts/github-io-root-forwarding.mjs in
# the private TPC_Web repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check the Google Play verification file is present
        run: test -s site/google602adbdea3a9018c.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
