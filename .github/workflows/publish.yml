name: Publish blog

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build publication from Sanity
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload publication
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy publication
        id: deployment
        uses: actions/deploy-pages@v5
